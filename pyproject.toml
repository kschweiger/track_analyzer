[project]
name = "geo-track-analyzer"
description = "Analyze geospacial data tracks"
version = "3.1.1"
authors = [{ name = "Korbinian Schweiger", email = "korbinian.schweiger@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
keywords = ["fit", "gpx", "visualization", "analysis"]
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5.4,<3",
  "gpxpy~=1.6",
  "requests>=2.34.2,<3",
  "pandas>=2.3.3,<3",
  "pydantic>=2.14.1,<3",
  "pydantic-numpy",
  "garmin-fit-sdk>=21.218.0,<22",
]

[project.urls]
Home = "https://github.com/kschweiger/track_analyzer"
Documentation = "https://kschweiger.github.io/track_analyzer/"
Source = "https://github.com/kschweiger/track_analyzer"

[project.scripts]
extract-fit-track = 'geo_track_analyzer:extract_track'
enhance-elevation = 'geo_track_analyzer:update_elevation'

[project.optional-dependencies]
cli = ["click>=8.5.0,<9", "rich"]
full = ["geo-track-analyzer[cli]"]
visualization = ["plotly>=5.24.1,<6"]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests/"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "PD", "PT", "NPY", "N", "W", "RET", "ANN", "RUF", "SIM", "PERF"]
unfixable = ["F841", "RUF015"]
ignore = [
  "ANN202",
  "ANN205",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN401",
  "RET502",
  "RET503",
  "RET504",
  "RET505",
  "RUF005",
  "RUF009",
  "E731",
]
[tool.mypy]
strict_optional = true
check_untyped_defs = true
exclude = "tests"

[[tool.mypy.overrides]]
module = "fitparse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "coloredlogs.*"
ignore_missing_imports = true

[tool.git-changelog]
output = "CHANGELOG.md"
convention = "conventional"
template = "path:.git-changelog/angular.md.jinja"

[dependency-groups]
dev = [
  "bpython>=0.26",
  "debugpy>=1.8.22",
  "pre-commit>=4.7.0",
  "ruff>=0.17.1",
  "uv>=0.13.2",
  "geo-track-analyzer[full]",
]
doc = [
  "mkdocs>=1.6.1",
  "mkdocs-click>=0.9.0",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.8",
  "griffe>=2.4.0,<2.5", # version 2 does introduce issues with mkdocstrings[python]
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-dependency>=0.6.1",
  "pytest-mock>=3.17.0",
  "pytest-retry>=1.7.0",
  "pytest-sugar>=1.1.1",
]
[tool.uv]
default-groups = ["dev", "test"]
